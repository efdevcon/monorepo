name: Pretalx Sync (devcon8)

on:
  schedule:
    - cron: "0 23 30 * *"
  workflow_dispatch:

# Serialize runs so two syncs can't race to commit the same data files.
concurrency:
  group: pretalx-sync-devcon8
  cancel-in-progress: false

jobs:
  build:
    defaults:
      run:
        working-directory: ./devcon-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # the runner image can lag behind a 22.x security release
          check-latest: true
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm sync:pretalx:devcon8
        env:
          PRETALX_API_KEY_MUMBAI: ${{ secrets.PRETALX_API_KEY_MUMBAI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          WEBHOOK_MEERKAT_SECRET: ${{ secrets.WEBHOOK_MEERKAT_SECRET }}
          # Optional: lets the sync mirror speaker avatars into Supabase
          # Storage (services/avatar-mirror); skipped gracefully when unset.
          # Uses devcon-api's own project credentials, not devcon-ai's RAG ones.
          SUPABASE_URL: ${{ secrets.DEVCON_API_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEVCON_API_SUPABASE_KEY }}
      - uses: EndBug/add-and-commit@v9
        with:
          add: "devcon-api/data"
          default_author: github_actions
          message: "[action] Pretalx Sync (devcon8)"
          pull: "--rebase --autostash -X theirs"
      # AV asset pack (cards, speaker photos, lower-third CSVs) into the AV team's
      # Drive folder; only new or changed files, tracked by data/av-assets/devcon8.json.
      # Never fails the sync. Needs the Google service account with access to the folder.
      - name: AV assets
        continue-on-error: true
        run: pnpm av:assets devcon8 --upload
        env:
          PRETALX_API_KEY_MUMBAI: ${{ secrets.PRETALX_API_KEY_MUMBAI }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          AV_DRIVE_FOLDER_ID_DEVCON8: ${{ secrets.AV_DRIVE_FOLDER_ID_DEVCON8 }}
      - uses: EndBug/add-and-commit@v9
        with:
          add: "devcon-api/data/av-assets"
          default_author: github_actions
          message: "[action] AV assets manifest (devcon8)"
          pull: "--rebase --autostash -X theirs"
      - name: Sync sessions to RAG DB
        working-directory: ./devcon-ai
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pnpm install
          pnpm sync:sessions --event devcon8
