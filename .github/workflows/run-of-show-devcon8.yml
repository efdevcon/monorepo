name: Run of Show (devcon8)

on:
  workflow_dispatch:

concurrency:
  group: run-of-show-devcon8
  cancel-in-progress: true

jobs:
  generate:
    defaults:
      run:
        working-directory: ./devcon-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm run-of-show:devcon8
        env:
          PRETALX_API_KEY_MUMBAI: ${{ secrets.PRETALX_API_KEY_MUMBAI }}
          # Same service account as av-assets (sync-pretalx-devcon8.yml): it has the AV folder and the template.
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          # The AV team's Drive, shared with av-assets: sheets go to $$EVENT/<Room>/<Day>/.
          AV_DRIVE_FOLDER_ID_DEVCON8: ${{ secrets.AV_DRIVE_FOLDER_ID_DEVCON8 }}
          ROS_TEMPLATE_ID: ${{ secrets.ROS_TEMPLATE_ID }}
