name: Run of Show (test-devcon-8)

on:
  workflow_dispatch:

concurrency:
  group: run-of-show-test-devcon-8
  cancel-in-progress: true

jobs:
  generate:
    # Off for now: test-devcon-8 sheets are generated locally (pnpm run-of-show:test)
    # and there is no ROS_FOLDER_ID secret for them. Dispatches from the Pretalx
    # webhook still succeed, the run just shows as skipped.
    if: ${{ false }}
    defaults:
      run:
        working-directory: ./devcon-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm run-of-show:test
        env:
          PRETALX_API_KEY_MUMBAI: ${{ secrets.PRETALX_API_KEY_MUMBAI }}
          ROS_GOOGLE_CLIENT_EMAIL: ${{ secrets.ROS_GOOGLE_CLIENT_EMAIL }}
          ROS_GOOGLE_PRIVATE_KEY: ${{ secrets.ROS_GOOGLE_PRIVATE_KEY }}
          ROS_FOLDER_ID: ${{ secrets.ROS_FOLDER_ID }}
          ROS_TEMPLATE_ID: ${{ secrets.ROS_TEMPLATE_ID }}
