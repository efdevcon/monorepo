[build]
    ignore = "if [ ${COMMIT_REF} == ${CACHED_COMMIT_REF} ] ; then false ; else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ../devcon ../lib ':(exclude)../devcon/.claude/**' ; fi"
    command = "pnpm run build"
    publish = ".next"

[functions]
  included_files = ["src/content/**/*"]

[[plugins]]
    package = "@netlify/plugin-nextjs"

[[edge_functions]]
  path = "/_next/image/*"
  function = "image-csp"

[[redirects]]
  from = "/grants"
  to = "https://esp.ethereum.foundation/devcon-grants"
  status = 302
  force = true

[[redirects]]
  from = "/speak"
  to = "https://speak.devcon.org/devcon7-sea/cfp"
  status = 302
  force = true

[[redirects]]
  from = "/side-events"
  to = "https://devcon.org/devcon-week"
  status = 302
  force = true

[[redirects]]
  from = "/schedule"
  to = "https://app.devcon.org/schedule"
  status = 302
  force = true

[[redirects]]
  from = "/qr-code/devcon-8-local-early-bird*"
  to = "/en/tickets/store/"
  status = 302
  force = true

[[redirects]]
  from = "/:locale/qr-code/devcon-8-local-early-bird*"
  to = "/en/tickets/store/"
  status = 302
  force = true

# Printed QR codes for the event app. Matomo params follow the repo convention
# (campaign = surface, keyword = which code); an optional last segment names
# where the code is printed and lands in mtm_placement, so one rule serves
# /qr/app, /qr/app/airport-banner, /qr/app/venue-entrance, ... 302 so a
# printed code can be re-pointed.
[[redirects]]
  from = "/qr/app"
  to = "https://app.devcon.org/?mtm_campaign=qr&mtm_kwd=app"
  status = 302
  force = true

[[redirects]]
  from = "/:locale/qr/app"
  to = "https://app.devcon.org/?mtm_campaign=qr&mtm_kwd=app"
  status = 302
  force = true

[[redirects]]
  from = "/qr/app/:placement"
  to = "https://app.devcon.org/?mtm_campaign=qr&mtm_kwd=app&mtm_placement=:placement"
  status = 302
  force = true

[[redirects]]
  from = "/:locale/qr/app/:placement"
  to = "https://app.devcon.org/?mtm_campaign=qr&mtm_kwd=app&mtm_placement=:placement"
  status = 302
  force = true
