[build]
    ignore = "if [ ${COMMIT_REF} == ${CACHED_COMMIT_REF} ] ; then false ; else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ../devcon ../lib ':(exclude)../devcon/.claude/**' ; fi"
    command = "pnpm run build"
    publish = ".next"

[functions]
  included_files = ["src/content/**/*"]

[[plugins]]
    package = "@netlify/plugin-nextjs"

[[edge_functions]]
  path = "/_next/image/*"
  function = "image-csp"

# Community Hub schedule templates, devcon.org/community-hubs-templates/<Hub-name>.xlsx
# (generated outside the repo, see docs/community-hubs.md): download on click
# instead of opening in the browser.
[[headers]]
  for = "/community-hubs-templates/*"
  [headers.values]
    Content-Disposition = "attachment"

[[redirects]]
  from = "/grants"
  to = "https://esp.ethereum.foundation/devcon-grants"
  status = 302
  force = true

[[redirects]]
  from = "/speak"
  to = "https://speak.devcon.org/devcon7-sea/cfp"
  status = 302
  force = true

[[redirects]]
  from = "/side-events"
  to = "https://devcon.org/devcon-week"
  status = 302
  force = true

[[redirects]]
  from = "/schedule"
  to = "https://app.devcon.org/schedule"
  status = 302
  force = true

[[redirects]]
  from = "/qr-code/devcon-8-local-early-bird*"
  to = "/en/tickets/store/"
  status = 302
  force = true

[[redirects]]
  from = "/:locale/qr-code/devcon-8-local-early-bird*"
  to = "/en/tickets/store/"
  status = 302
  force = true

# Printed QR codes (/qr/<slug>[/<placement>]) are not redirect rules any more:
# src/middleware.ts rewrites them to /api/qr/, which reads the targets from the
# team-managed NocoDB table (src/services/qr-redirects.ts).
